name: Train iteration 1 (G1)

# Which models to train, and an earlier run whose model artifacts fill in the rest, come from
# .github/train-plan.json (so a push can train a subset; e.g. after a cancelled job).
# Each training job also pushes its output folder to `checkpoints/<branch>/<model>` after every
# epoch (scripts/train-checkpoint.sh) and restores it at start, so a cancelled or crashed job
# resumes where it stopped, and a completed model is reused instead of retrained.
#
# Spec 002 T031/T033 on GitHub-hosted runners: one job per model (≤ 5.5 h each, GitHub's job
# limit is 6 h), then the G1 evaluation. Data and features are regenerated in every job from the
# fixed seed (byte-identical, constitution II). Outputs are pushed to `results/g1-<run id>` for
# the agent review panel; nothing is merged automatically.

on:
  push:
    branches: ["train/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read # download model artifacts from the plan's reuse_run

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA: ${{ github.workspace }}/../i1-data

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.plan.outputs.models }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          echo "models=$(jq -c .models .github/train-plan.json)" >> "$GITHUB_OUTPUT"
          echo "reuse_run=$(jq -r '.reuse_run // ""' .github/train-plan.json)" >> "$GITHUB_OUTPUT"
          cat .github/train-plan.json

  train:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the G0 guard diffs the generator source against the verified commit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Data and features (seed 101, quickstart §1)
        run: |
          pnpm tma-generate --seed 101 --count 100000 --ranges configs/iter1-ranges.json \
            --heldout-ranges configs/iter1-heldout-ranges.json --out "$DATA"
          pnpm tma-features norm --train "$DATA/train.f32pack" --out "$DATA/norm.json"
          for s in train validation; do
            pnpm tma-features build --in "$DATA/$s.f32pack" --norm "$DATA/norm.json" --out "$DATA/$s.features.bin"
          done
          sha256sum "$DATA"/*.f32pack "$DATA"/*.features.bin
      - name: Restore checkpoint (resume a cancelled or crashed run)
        run: |
          echo "OUT=$RUNNER_TEMP/models/${{ matrix.model }}" >> "$GITHUB_ENV"
          echo "CKPT=checkpoints/${GITHUB_REF_NAME}/${{ matrix.model }}" >> "$GITHUB_ENV"
          scripts/train-checkpoint.sh restore "$RUNNER_TEMP/models/${{ matrix.model }}" \
            "checkpoints/${GITHUB_REF_NAME}/${{ matrix.model }}"
      - name: Train ${{ matrix.model }}
        shell: bash # -o pipefail, so a failed run is not hidden by tee
        run: |
          if [ -f "$OUT/manifest.json" ] && jq -e .complete "$OUT/manifest.json" >/dev/null; then
            echo "$CKPT holds a completed model: not retraining"
            echo "restored complete model from $CKPT" > "$RUNNER_TEMP/train.log"
            exit 0
          fi
          # Push the output folder to $CKPT after every epoch (manifest change).
          scripts/train-checkpoint.sh watch "$OUT" "$CKPT" &
          WATCH=$!
          trap 'kill $WATCH 2>/dev/null || true' EXIT
          pnpm tma-train --config configs/iter1/${{ matrix.model }}.json \
            --train "$DATA/train.features.bin" --val "$DATA/validation.features.bin" \
            --out "$OUT" 2>&1 | tee "$RUNNER_TEMP/train.log"
          kill $WATCH
          scripts/train-checkpoint.sh sync "$OUT" "$CKPT"
          lscpu | grep "Model name"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-${{ matrix.model }}
          path: |
            ${{ runner.temp }}/models/${{ matrix.model }}/manifest.json
            ${{ runner.temp }}/models/${{ matrix.model }}/model.json
            ${{ runner.temp }}/models/${{ matrix.model }}/weights.bin
            ${{ runner.temp }}/train.log
          retention-days: 30
          overwrite: true

  g1:
    needs: [plan, train]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse_run != ''
        with:
          path: ${{ runner.temp }}/artifacts-reused
          run-id: ${{ needs.plan.outputs.reuse_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect trained models (this run first, then the plan's reuse_run)
        run: |
          for m in instantaneous time-late causal-cnn mlp instantaneous-shuffled; do
            mkdir -p "$RUNNER_TEMP/models/$m" "$RUNNER_TEMP/logs"
            # upload-artifact strips the common prefix ($RUNNER_TEMP): models/<m>/… and train.log
            for src in "$RUNNER_TEMP/artifacts/model-$m" "$RUNNER_TEMP/artifacts-reused/model-$m"; do
              if [ -f "$src/models/$m/weights.bin" ]; then
                cp "$src/models/$m/"* "$RUNNER_TEMP/models/$m/"
                cp "$src/train.log" "$RUNNER_TEMP/logs/$m.log"
                echo "$m <- $src"
                break
              fi
            done
            test -f "$RUNNER_TEMP/models/$m/weights.bin" || { echo "no trained $m"; exit 1; }
          done
          find "$RUNNER_TEMP/models" -type f | sort
      - name: Data and features (all splits)
        run: |
          pnpm tma-generate --seed 101 --count 100000 --ranges configs/iter1-ranges.json \
            --heldout-ranges configs/iter1-heldout-ranges.json --out "$DATA"
          pnpm tma-features norm --train "$DATA/train.f32pack" --out "$DATA/norm.json"
          for s in train validation test heldout; do
            pnpm tma-features build --in "$DATA/$s.f32pack" --norm "$DATA/norm.json" --out "$DATA/$s.features.bin"
          done
      - name: G1 (naive + classical per-timestep + models; gate exit 3 is a result, not an error)
        shell: bash
        run: |
          EXP="experiments/$(date -u +%Y%m%d)-g1"
          echo "EXP=$EXP" >> "$GITHUB_ENV"
          pnpm tma-g1 --data "$DATA" --models "$RUNNER_TEMP/models" --experiment "$EXP" || [ $? -eq 3 ]
          mkdir -p "$EXP/logs"
          cp "$RUNNER_TEMP/logs/"*.log "$EXP/logs/"
          cat "$EXP/verdict.json"
      - name: Push results branch for the agent panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "results/g1-${{ github.run_id }}"
          git add "$EXP"
          git commit -qm "experiments: G1 run ${{ github.run_id }} (CI, ${{ github.sha }})"
          git push origin "results/g1-${{ github.run_id }}"
