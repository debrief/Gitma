name: Train a plan

# Spec 003 T040: trains the models of a plan file on GitHub-hosted runners, then evaluates them.
# The plan is configs/<plan>/plan.json, chosen by the branch (train/i2a → configs/iter2/a/plan.json,
# train/i2b → configs/iter2/b/plan.json) or by the `plan` input of a manual run (e.g. iter2/a).
# All logic beyond wiring is in scripts/train-plan.mjs (unit-tested).
#
# - Every job regenerates the plan's dataset from its seed and checks the content digests the plan
#   pins (constitution II); a generator change since the plan was pinned fails the job.
# - Each model trains in up to three chained jobs of ≤ 345 min (decision 9): job 2 and job 3 start
#   after the previous one (whatever its outcome), restore the checkpoint branch
#   `checkpoints/<branch>/<model>` (pushed after every epoch, with Adam state) and resume; a job
#   whose model is already complete does nothing.
# - The evaluation job restores every completed model and runs the plan's `evaluate` (tma-g2). A
#   validation evaluation never sees the test or held-out split (they are deleted after the digest
#   check). Results are pushed to `results/<plan id>-<run id>`, cut from origin/main; nothing is
#   merged automatically.
#
# Iteration 1 (train/i1, .github/train-plan.json) is retired: its verdict is reproduced by
# re-scoring the committed weights (evaluate-g1.yml), not by re-training (AGENTS.md).

on:
  push:
    branches: ["train/**"]
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan folder under configs/ (e.g. iter2/a)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA: ${{ github.workspace }}/../plan-data

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      id: ${{ steps.plan.outputs.id }}
      models: ${{ steps.plan.outputs.models }}
      configs: ${{ steps.plan.outputs.configs }}
      split: ${{ steps.plan.outputs.split }}
      command: ${{ steps.plan.outputs.command }}
      continue_from: ${{ steps.plan.outputs.continue_from }}
      continue_allow: ${{ steps.plan.outputs.continue_allow }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: plan
        env:
          PLAN: ${{ inputs.plan }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node scripts/train-plan.mjs resolve > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          cat "$(sed -n 's/^plan=//p' "$RUNNER_TEMP/plan.txt")"

  train-1:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    uses: ./.github/workflows/train-model.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      configs: ${{ needs.plan.outputs.configs }}
      model: ${{ matrix.model }}
      attempt: 1
      continue_from: ${{ fromJSON(needs.plan.outputs.continue_from)[matrix.model] || '' }}
      continue_allow: ${{ needs.plan.outputs.continue_allow }}

  train-2:
    needs: [plan, train-1]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    uses: ./.github/workflows/train-model.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      configs: ${{ needs.plan.outputs.configs }}
      model: ${{ matrix.model }}
      attempt: 2

  train-3:
    needs: [plan, train-2]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    uses: ./.github/workflows/train-model.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      configs: ${{ needs.plan.outputs.configs }}
      model: ${{ matrix.model }}
      attempt: 3

  evaluate:
    needs: [plan, train-3]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Data and features (digests checked against the plan)
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          SPLIT: ${{ needs.plan.outputs.split }}
        run: |
          if [ "$SPLIT" = test ]; then
            node scripts/train-plan.mjs data "$PLAN" "$DATA" train validation test heldout
          else
            node scripts/train-plan.mjs data "$PLAN" "$DATA" train validation
            # Validation-only selection (research R5): the test and held-out splits are not kept.
            rm -f "$DATA"/test.* "$DATA"/heldout.*
          fi
          ls -l "$DATA"
      - name: Collect the trained models (completed checkpoints)
        env:
          MODELS: ${{ needs.plan.outputs.models }}
          CONFIGS: ${{ needs.plan.outputs.configs }}
        run: |
          for m in $(echo "$MODELS" | jq -r '.[]'); do
            # G0 guard and lineage on this job's regenerated data, as before training.
            pnpm tma-train --check --config "$CONFIGS/$m.json" \
              --train "$DATA/train.features.bin" --val "$DATA/validation.features.bin" \
              --out "$RUNNER_TEMP/models/$m"
            scripts/train-checkpoint.sh restore "$RUNNER_TEMP/models/$m" "checkpoints/${GITHUB_REF_NAME}/$m"
            node scripts/train-plan.mjs complete "$RUNNER_TEMP/models/$m" || {
              echo "::error::$m did not complete in three jobs"
              exit 1
            }
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          path: ${{ runner.temp }}/logs
      - name: Evaluate (the plan's command; gate exit 3 is a result, not an error)
        shell: bash
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          ID: ${{ needs.plan.outputs.id }}
          SPLIT: ${{ needs.plan.outputs.split }}
          CMD: ${{ needs.plan.outputs.command }}
        run: |
          case "$CMD" in
            tma-g2) SUFFIX=$([ "$SPLIT" = test ] && echo g2 || echo val) ;;
            tma-scan) SUFFIX=scan ;;
            *) echo "::error::unknown evaluate command $CMD"; exit 1 ;;
          esac
          EXP="experiments/$(date -u +%Y%m%d)-$ID-$SUFFIX"
          echo "EXP=$EXP" >> "$GITHUB_ENV"
          mapfile -t ARGS < <(node scripts/train-plan.mjs evaluate-args "$PLAN" "$DATA" "$RUNNER_TEMP/models" "$EXP")
          pnpm "$CMD" "${ARGS[@]}" || [ $? -eq 3 ]
          mkdir -p "$EXP/logs"
          find "$RUNNER_TEMP/logs" -name train.log | while read -r f; do
            cp "$f" "$EXP/logs/$(basename "$(dirname "$f")").log"
          done
          cat "$EXP"/verdict.json "$EXP"/diagnostic.json 2>/dev/null || true
      - name: Push results branch
        env:
          ID: ${{ needs.plan.outputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch from main: a results branch carrying this branch's workflow edits cannot be pushed
          # with the default token (no workflows permission).
          B="results/$ID-${{ github.run_id }}"
          git checkout -b "$B" origin/main
          git add "$EXP"
          git commit -qm "experiments: $ID run ${{ github.run_id }} (CI, ${{ github.sha }})"
          git push origin "$B"
      - name: Delete checkpoint branches (this run's, and any whose train branch is gone)
        run: |
          heads=$(git ls-remote --heads origin | awk '{print $2}' | sed 's#^refs/heads/##')
          for b in $(echo "$heads" | grep '^checkpoints/' || true); do
            src=${b#checkpoints/}
            src=${src%/*}
            if [ "$src" = "$GITHUB_REF_NAME" ] || ! echo "$heads" | grep -qxF "$src"; then
              git push origin --delete "$b" && echo "deleted $b"
            fi
          done
