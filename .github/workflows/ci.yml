name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the G0 guard diffs the generator source against the verified commit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - name: Schema regeneration check
        run: pnpm schema:check
      - name: Build and typecheck
        run: pnpm typecheck
      - name: Lint and format
        run: pnpm lint
      - name: Unit and golden tests
        run: pnpm test
      - name: End-to-end G0 (1,000 noise-free scenarios)
        run: |
          pnpm tma-generate --seed 42 --count 1000 --noise-free --out "$RUNNER_TEMP/g0"
          pnpm tma-g0 --data "$RUNNER_TEMP/g0" --experiment "$RUNNER_TEMP/exp/g0"
      - name: End-to-end G1 pipeline (300 scenarios, tiny models, 1 epoch; result not asserted)
        run: |
          D="$RUNNER_TEMP/g1"
          pnpm tma-generate --seed 7 --count 300 --ranges configs/iter1-ranges.json \
            --heldout-ranges configs/iter1-heldout-ranges.json --out "$D"
          pnpm tma-features norm --train "$D/train.f32pack" --out "$D/norm.json"
          for s in train validation test heldout; do
            pnpm tma-features build --in "$D/$s.f32pack" --norm "$D/norm.json" --out "$D/$s.features.bin"
          done
          # The training guard and lineage check accept the G0 run above (same commit, clean
          # tree), so this smoke test does not depend on the committed G0 matching this commit.
          for m in instantaneous time-late causal-cnn mlp instantaneous-shuffled; do
            pnpm tma-train --config configs/ci/$m.json --train "$D/train.features.bin" \
              --val "$D/validation.features.bin" --out "$RUNNER_TEMP/models/$m" \
              --experiments "$RUNNER_TEMP/exp"
          done
          pnpm tma-g1 --data "$D" --models "$RUNNER_TEMP/models" --experiment "$RUNNER_TEMP/exp/g1" || [ $? -eq 3 ]
          test -f "$RUNNER_TEMP/exp/g1/verdict.json"
      - name: End-to-end iteration-2 plans (300 noisy scenarios, tiny models, 1 epoch, raw and derived; result not asserted)
        shell: bash
        run: |
          # The same script steps train.yml runs: data with digest check, training, tma-g2 on validation.
          for plan in ci ci/derived; do
            P="configs/$plan/plan.json"
            D="$RUNNER_TEMP/plan-${plan//\//-}"
            node scripts/train-plan.mjs data "$P" "$D" train validation
            for m in $(jq -r '.models[]' "$P"); do
              node packages/models/dist/cli-train.js --config "$(jq -r .configs "$P")/$m.json" \
                --train "$D/train.features.bin" --val "$D/validation.features.bin" \
                --out "$D/models/$m" --experiments "$RUNNER_TEMP/exp"
            done
            rm -f "$D"/test.* "$D"/heldout.* # validation runs never see the test split
            EXP="$RUNNER_TEMP/exp/$(jq -r .id "$P")-val"
            mapfile -t ARGS < <(node scripts/train-plan.mjs evaluate-args "$P" "$D" "$D/models" "$EXP")
            node packages/models/dist/cli-g2.js "${ARGS[@]}" || [ $? -eq 3 ]
            test -f "$EXP/diagnostic.json" && test -f "$EXP/bootstrap.json" && test -f "$EXP/comparison.csv"
          done
      - name: Site build (data dictionary, gate status, links)
        run: pnpm site:build
