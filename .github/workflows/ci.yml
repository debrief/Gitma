name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - name: Schema regeneration check
        run: pnpm schema:check
      - name: Build and typecheck
        run: pnpm typecheck
      - name: Lint and format
        run: pnpm lint
      - name: Unit and golden tests
        run: pnpm test
      - name: End-to-end G0 (1,000 noise-free scenarios)
        run: |
          pnpm tma-generate --seed 42 --count 1000 --noise-free --out "$RUNNER_TEMP/g0"
          pnpm tma-g0 --data "$RUNNER_TEMP/g0" --experiment "$RUNNER_TEMP/exp/g0"
      - name: Site build (data dictionary, gate status, links)
        run: pnpm site:build
